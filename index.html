<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>charity: water — Your Dollar Funds Clean Water</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #0A2334;
    --white: #FFF7E1;
    --navy: #003366;
    --navy-deep: #002347;
    --black: #0A0A0A;
    --yellow: #FFC907;
    --yellow-dark: #E6B300;
    --cream: #F6F3EC;
    --line: rgba(255,255,255,0.14);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{scroll-behavior:smooth;}

  html, body{
    height:100%;
  }

  body{
    font-family:'Proxima Nova', 'Karla', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    color:var(--ink);
    background:var(--navy);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3{
    font-family:'Proxima Nova', 'Archivo', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-weight:800;
    letter-spacing:-0.01em;
  }

  a{color:inherit;text-decoration:none;}

  img{max-width:100%;display:block;}

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:0 40px;
  }

  /* ===== HEADER / HERO ===== */

  .hero{
    background:var(--navy);
    color:var(--white);
    position:relative;
    overflow:hidden;
    min-height:100vh;
    display:flex;
    align-items:stretch;
  }

  .hero-grid{
    margin:0 auto;
    display:grid;
    grid-template-columns:minmax(0, 590px) 1fr;
    align-items:stretch;
    min-height:640px;
    width:100%;
  }

  .hero-content{
    padding:40px 48px 56px 40px;
    display:flex;
    flex-direction:column;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:64px;
  }

  .brand-logo{
    height:22px;
    width:auto;
  }

  .hero-copy{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    max-width:460px;
  }

  .hero-copy h1{
    font-size:clamp(34px, 4.4vw, 48px);
    line-height:1.08;
    margin-bottom:24px;
  }

  .hero-copy p{
    font-size:16.5px;
    font-weight:500;
    color:rgba(255,255,255,0.88);
    max-width:400px;
    margin-bottom:36px;
  }

  .btn-donate{
    display:inline-block;
    background:var(--yellow);
    color:var(--navy-deep);
    font-family:'Proxima Nova', 'Archivo', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-weight:700;
    font-size:16px;
    padding:16px 34px;
    border-radius:2px;
    width:fit-content;
    border:none;
    cursor:pointer;
    transition:background 0.15s ease, transform 0.1s ease;
  }

  .btn-donate:hover{
    background:var(--yellow-dark);
  }

  .btn-donate:active{
    transform:translateY(1px);
  }

  .hero-footer-nav{
    display:flex;
    gap:34px;
    margin-top:48px;
    flex-wrap:wrap;
  }

  .hero-footer-nav a{
    font-size:14.5px;
    font-weight:700;
    color:var(--white);
    opacity:0.92;
  }

  .hero-footer-nav a:hover{
    opacity:1;
    text-decoration:underline;
    text-underline-offset:4px;
  }

  .hero-image{
    position:relative;
    min-height:320px;
    display:flex;
    justify-content:flex-end;
    overflow:hidden;
    background:var(--navy);
  }

  .hero-image img{
    width:590px;
    max-width:590px;
    flex-shrink:0;
    height:100%;
    object-fit:cover;
    object-position:center 20%;
  }

  /* ===== STAT STRIP ===== */

  .stat-strip{
    background:var(--cream);
    border-bottom:1px solid rgba(10,35,52,0.08);
  }

  .stat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    padding:44px 40px;
    gap:32px;
  }

  .stat{
    text-align:left;
    border-left:3px solid var(--yellow);
    padding-left:20px;
  }

  .stat .num{
    font-family:'Proxima Nova', 'Archivo', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-weight:800;
    font-size:34px;
    color:var(--navy);
    line-height:1;
    margin-bottom:8px;
  }

  .stat .label{
    font-size:14px;
    font-weight:500;
    color:#3c4c58;
    max-width:220px;
  }

  /* ===== HOW IT WORKS ===== */

  .section{
    padding:96px 40px;
  }

  .section-head{
    max-width:560px;
    margin-bottom:56px;
  }

  .eyebrow{
    color:var(--navy);
    font-weight:700;
    font-size:13px;
    margin-bottom:14px;
    opacity:0.55;
  }

  .section-head h2{
    font-size:clamp(28px,3.2vw,38px);
    color:var(--navy);
    line-height:1.15;
    margin-bottom:16px;
  }

  .section-head p{
    font-size:16px;
    color:#4a5763;
    max-width:480px;
  }

  .steps{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:40px;
    max-width:1100px;
    margin:0 auto;
  }

  .step{
    padding-top:24px;
    border-top:2px solid rgba(10,47,77,0.12);
  }

  .step .step-num{
    font-family:'Proxima Nova', 'Archivo', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-weight:800;
    font-size:15px;
    color:var(--yellow-dark);
    background:var(--navy);
    width:34px;
    height:34px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:22px;
  }

  .step h3{
    font-size:19px;
    color:var(--navy);
    margin-bottom:10px;
  }

  .step p{
    font-size:15px;
    color:#54626e;
  }

  /* ===== STORY / SPLIT ===== */

  .story{
    background:var(--navy-deep);
    color:var(--white);
  }

  .story-grid{
    max-width:1180px;
    margin:0 auto;
    display:grid;
    grid-template-columns:0.9fr 1.1fr;
    align-items:center;
    gap:0;
  }

  .story-copy{
    padding:80px 56px 80px 40px;
  }

  .story-copy .eyebrow{
    color:var(--yellow);
    opacity:1;
  }

  .story-copy h2{
    color:var(--white);
    font-size:clamp(26px,3vw,34px);
    margin-bottom:20px;
    line-height:1.18;
  }

  .story-copy p{
    color:rgba(255,255,255,0.78);
    font-size:15.5px;
    margin-bottom:28px;
    max-width:420px;
  }

  .story-quote{
    border-left:3px solid var(--yellow);
    padding-left:18px;
    font-family:'Proxima Nova', 'Archivo', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-weight:600;
    font-size:17px;
    color:var(--white);
    margin-bottom:10px;
  }

  .story-attrib{
    font-size:13.5px;
    color:rgba(255,255,255,0.6);
  }

  .story-image img{
    width:100%;
    height:100%;
    min-height:420px;
    object-fit:cover;
  }

  /* ===== CTA BAND ===== */

  .cta-band{
    background:var(--yellow);
    padding:64px 40px;
  }

  .cta-inner{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:32px;
    flex-wrap:wrap;
  }

  .cta-inner h2{
    color:var(--navy-deep);
    font-size:clamp(24px,2.8vw,32px);
    max-width:520px;
    line-height:1.2;
  }

  .btn-navy{
    display:inline-block;
    background:var(--navy);
    color:var(--white);
    font-family:'Proxima Nova', 'Archivo', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-weight:700;
    font-size:16px;
    padding:16px 34px;
    border-radius:2px;
    border:none;
    cursor:pointer;
    white-space:nowrap;
  }

  .btn-navy:hover{
    background:var(--navy-deep);
  }

  /* ===== FOOTER ===== */

  footer{
    background:var(--navy);
    color:rgba(255,255,255,0.75);
    padding:56px 40px 32px;
  }

  .footer-grid{
    max-width:1180px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
    gap:32px;
    padding-bottom:32px;
    border-bottom:1px solid var(--line);
  }

  .footer-brand{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .footer-brand .brand-mark{width:22px;height:22px;}

  .footer-brand span{
    font-family:'Proxima Nova', 'Archivo', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-weight:700;
    color:var(--white);
    font-size:16px;
    letter-spacing:0.05em;
  }

  .footer-links{
    display:flex;
    gap:36px;
    flex-wrap:wrap;
  }

  .footer-links a{
    font-size:14px;
    font-weight:500;
  }

  .footer-links a:hover{
    color:var(--white);
  }

  .footer-bottom{
    max-width:1180px;
    margin:0 auto;
    padding-top:24px;
    font-size:13px;
    color:rgba(255,255,255,0.45);
  }

  /* ===== RESPONSIVE ===== */

  @media (max-width: 860px){
    .wrap{padding:0 24px;}
    .hero-grid{grid-template-columns:1fr; min-height:auto;}
    .hero-content{padding:32px 24px 40px;}
    .hero-image{min-height:320px;}
    .hero-image img{width:100%; max-width:100%;}
    .brand{margin-bottom:40px;}
    .hero-footer-nav{margin-top:32px; gap:24px;}
    .stat-grid{grid-template-columns:1fr; padding:36px 24px; gap:28px;}
    .section{padding:64px 24px;}
    .steps{grid-template-columns:1fr; gap:32px;}
    .story-grid{grid-template-columns:1fr;}
    .story-copy{padding:56px 24px;}
    .story-image img{min-height:260px;}
    .cta-band{padding:48px 24px;}
    .cta-inner{flex-direction:column; align-items:flex-start;}
    footer{padding:48px 24px 24px;}
    .footer-grid{flex-direction:column; gap:24px;}
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{transition:none !important;}
  }

  :focus-visible{
    outline:3px solid var(--yellow);
    outline-offset:2px;
  }
</style>
</head>
